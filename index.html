<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon app</title>
<meta name="theme-color" content="#00874E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon app">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#1C1C1E; --muted:#6B6B70; --line:#E4E4E9; --field:#F2F2F7;
  --brand:#00874E; --brand-text:#00874E; --on-brand:#FFFFFF; --over:#D13B2F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --ink:#FFFFFF; --muted:#98989F; --line:#38383A; --field:#2C2C2E;
    --brand:#0A5A39; --brand-text:#3CCB8A; --on-brand:#FFFFFF; --over:#FF6B5E;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --ink:#FFFFFF; --muted:#98989F; --line:#38383A; --field:#2C2C2E;
  --brand:#0A5A39; --brand-text:#3CCB8A; --on-brand:#FFFFFF; --over:#FF6B5E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--ink);height:100%;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;
}
body.authbg,html.authbg{background:var(--brand)}
h1,p{margin:0}

/* Pages de connexion */
.auth{max-width:440px;margin:0 auto;padding:28px 20px 40px;color:var(--on-brand)}
.auth .mark{display:flex;align-items:center;gap:12px;margin:18px 0 26px}
.auth .mark img{width:44px;height:44px;border-radius:10px}
.auth .mark span{font-size:28px;font-weight:700;letter-spacing:-0.02em}
.card{background:var(--card);border-radius:14px;overflow:hidden;color:var(--ink)}
.auth h1{font-size:20px;font-weight:700;padding:16px 16px 0}
.form{padding:14px 16px 16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;
}
.fields{display:grid;gap:10px}
.btn{
  font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 18px;cursor:pointer;
  background:var(--brand);color:var(--on-brand);width:100%;margin-top:14px;
}
.btn[disabled]{opacity:.6}
:focus-visible{outline:3px solid var(--brand-text);outline-offset:2px}
.auth :focus-visible{outline-color:#fff}
.auth .card :focus-visible{outline-color:var(--brand-text)}
.msg{margin:0 16px 14px;font-size:14px;color:var(--muted)}
.msg.err{color:var(--over)}
.below{text-align:center;margin-top:16px;font-size:15px}
.link{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:6px}

/* Page principale : blanche */
.home{min-height:100%}
.signout{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;
  background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:10px;
}
</style>
</head>
<body>
<div id="app"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
var cfg=window.APP_CONFIG||{};
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function frErr(m){
  m=String(m||'');
  if(/invalid login credentials/i.test(m)) return 'Courriel ou mot de passe incorrect.';
  if(/email not confirmed/i.test(m)) return 'Confirme d\u2019abord ton courriel avec le lien reçu.';
  if(/already registered|already been registered/i.test(m)) return 'Ce courriel a déjà un compte. Connecte-toi.';
  if(/password should be at least/i.test(m)) return 'Le mot de passe doit avoir au moins 6 caractères.';
  if(/signups not allowed|signup is disabled/i.test(m)) return 'La création de comptes est désactivée.';
  if(/rate limit/i.test(m)) return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(/failed to fetch|network/i.test(m)) return 'Pas de connexion. Vérifie ton réseau.';
  return m||'Une erreur est survenue.';
}

var sb=null, session=null, mode='login', authMsg='', authErr=false, busy=false;
function configured(){
  return !!(cfg.SUPABASE_URL&&cfg.SUPABASE_KEY&&!/TON-PROJET/.test(cfg.SUPABASE_URL)&&window.supabase);
}

function mark(){return '<div class="mark"><img src="icon-192.png" alt=""><span>Mon app</span></div>'}

function viewConfig(){
  return '<div class="auth">'+mark()+'<section class="card"><h1>Configuration manquante</h1>'+
    '<div class="form"><p class="muted" style="color:var(--muted)">Ouvre le fichier <b>config.js</b> et remplace l\u2019adresse du projet Supabase et la clé publique, puis recharge la page.</p></div></section></div>';
}

function viewAuth(){
  var titles={login:'Connexion',signup:'Créer un compte',forgot:'Mot de passe oublié',recovery:'Nouveau mot de passe'};
  var btn={login:'Se connecter',signup:'Créer mon compte',forgot:'Envoyer le lien',recovery:'Enregistrer'}[mode];
  var fields='';
  if(mode!=='recovery') fields+='<div><label for="a-mail">Courriel</label><input id="a-mail" name="email" type="email" autocomplete="email" inputmode="email" required></div>';
  if(mode!=='forgot') fields+='<div><label for="a-pw">'+(mode==='recovery'?'Nouveau mot de passe':'Mot de passe')+'</label><input id="a-pw" name="password" type="password" minlength="6" autocomplete="'+(mode==='login'?'current-password':'new-password')+'" required></div>';
  var below='';
  if(mode==='login') below='<button class="link" data-act="mode" data-mode="signup">Créer un compte</button><br><button class="link" data-act="mode" data-mode="forgot">Mot de passe oublié</button>';
  else if(mode==='signup'||mode==='forgot') below='<button class="link" data-act="mode" data-mode="login">J\u2019ai déjà un compte</button>';
  return '<div class="auth">'+mark()+
    '<section class="card"><h1>'+titles[mode]+'</h1>'+
    '<form class="form" data-form="auth"><div class="fields">'+fields+'</div>'+
    '<button class="btn" type="submit">'+btn+'</button></form>'+
    (authMsg?'<p class="msg'+(authErr?' err':'')+'" role="alert">'+esc(authMsg)+'</p>':'')+
    '</section><p class="below">'+below+'</p></div>';
}

function viewHome(){
  return '<main class="home"><button class="signout" data-act="signout">Se déconnecter</button></main>';
}

function render(){
  var app=$('app'), authLook=true, html;
  if(!configured()) html=viewConfig();
  else if(mode==='recovery'||!session) html=viewAuth();
  else {html=viewHome();authLook=false}
  app.innerHTML=html;
  document.documentElement.classList.toggle('authbg',authLook);
  document.body.classList.toggle('authbg',authLook);
}

function guard(fn){
  if(busy) return Promise.resolve();
  busy=true;
  return fn().catch(function(e){authMsg=frErr(e&&e.message);authErr=true}).then(function(){busy=false;render()});
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b) return;
  if(b.dataset.act==='mode'){mode=b.dataset.mode;authMsg='';authErr=false;render();return}
  if(b.dataset.act==='signout'){guard(async function(){await sb.auth.signOut()})}
});

document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form="auth"]');
  if(!f) return;
  e.preventDefault();
  var fd=new FormData(f);
  guard(async function(){
    authMsg='';authErr=false;
    var email=String(fd.get('email')||'').trim(), pw=String(fd.get('password')||'');
    var here=location.origin+location.pathname;
    if(mode==='login'){
      var r=await sb.auth.signInWithPassword({email:email,password:pw});
      if(r.error){authMsg=frErr(r.error.message);authErr=true}
    }else if(mode==='signup'){
      var r2=await sb.auth.signUp({email:email,password:pw,options:{emailRedirectTo:here}});
      if(r2.error){authMsg=frErr(r2.error.message);authErr=true}
      else if(!r2.data.session){authMsg='Compte créé. Ouvre le lien reçu par courriel pour le confirmer, puis connecte-toi.';mode='login'}
    }else if(mode==='forgot'){
      var r3=await sb.auth.resetPasswordForEmail(email,{redirectTo:here});
      if(r3.error){authMsg=frErr(r3.error.message);authErr=true}
      else{authMsg='Si ce courriel a un compte, un lien vient de lui être envoyé.';mode='login'}
    }else if(mode==='recovery'){
      var r4=await sb.auth.updateUser({password:pw});
      if(r4.error){authMsg=frErr(r4.error.message);authErr=true}
      else{authMsg='';mode='login'}
    }
  });
});

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
if(configured()){
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(ev,s){
    session=s;
    if(ev==='PASSWORD_RECOVERY'){mode='recovery';authMsg='';authErr=false}
    else if(ev==='SIGNED_OUT'){mode='login'}
    if(ev==='TOKEN_REFRESHED') return;
    render();
  });
}
render();
})();
</script>
</body>
</html>
