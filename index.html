<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget App</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget App">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#EDEDED; --panel:#DEDEDE; --card:#FFFFFF; --ink:#333333; --muted:#6B6B6B; --line:#D6D6D6; --field:#BDBDBD;
  --brand:#00874E; --link:#007A45; --bar:#05603A; --over:#C0392B; --shadow:0 1px 6px rgba(0,0,0,.14);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --panel:#18181A; --card:#1C1C1E; --ink:#F2F2F2; --muted:#98989F; --line:#38383A; --field:#58585C;
    --brand:#00874E; --link:#3CCB8A; --bar:#0A3D28; --over:#FF6B5E; --shadow:none;
  }
}
html{background:var(--card);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--ink);min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;
}
body.white{background:var(--card)}
body.modal-open{overflow:hidden}
h1,h2,p{margin:0}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}

/* En-tête blanc */
.hdr{
  background:var(--card);border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top,0px) 16px 0;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.hdr>*{min-height:56px}
.brand{display:flex;align-items:center;gap:10px;color:var(--link);font-weight:700;font-size:24px;letter-spacing:-0.01em}
.brand img{width:30px;height:30px;border-radius:7px}
.htitle{flex:1;min-width:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.iconbtn{background:none;border:0;color:var(--ink);padding:0 4px;display:grid;place-items:center;cursor:pointer;min-width:44px}
.iconbtn svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Première page : plein écran, sans défilement */
html.lock{overflow:hidden;overscroll-behavior:none}
html.lock body{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
.welcome{height:100vh;height:100dvh;display:flex;flex-direction:column}
.wgray{flex:1;min-height:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px 24px 40px}
.wgray svg{width:min(100%,340px);height:auto;max-height:100%}
.sheet{
  flex:0 0 auto;background:var(--card);border-radius:24px 24px 0 0;margin-top:-24px;position:relative;
  padding:26px 16px calc(36px + env(safe-area-inset-bottom,0px));
}
.sheet h1{font-size:23px;font-weight:700;margin:0 0 22px 0}
.gbtn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
  background:var(--brand);color:#fff;border:0;border-radius:8px;
  font:inherit;font-size:19px;font-weight:700;padding:14px 16px;min-height:50px;cursor:pointer;
}
.gbtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{
  display:block;margin:22px auto 0;background:var(--card);color:var(--link);
  border:1.5px solid var(--link);border-radius:999px;font:inherit;font-size:18px;padding:9px 24px;cursor:pointer;
}

/* Pages de connexion */
.formpage{padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.fcard{background:var(--card);box-shadow:var(--shadow);padding:22px 20px 26px}
.onboarding{padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.onboarding .fcard{border-radius:10px}
.onboarding h1{font-size:23px;margin:0 0 8px}
.onboarding .msg{margin-bottom:22px}
.flabel{display:block;font-size:19px;font-weight:700;margin:0 0 10px}
.fgroup{margin-bottom:22px}
.fin{
  width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--card);
  border:1px solid var(--field);border-radius:4px;padding:14px 14px;
}
.pw{position:relative}
.pw .fin{padding-right:54px}
.eye{position:absolute;right:4px;top:0;bottom:0;width:48px;background:none;border:0;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.flink{display:block;background:none;border:0;color:var(--link);font:inherit;font-size:17px;text-decoration:underline;padding:6px 0;cursor:pointer;text-align:left}
.pbtn,.obtn{
  display:block;margin:26px auto 0;width:78%;min-width:220px;border-radius:6px;
  font:inherit;font-size:19px;font-weight:700;padding:14px 12px;cursor:pointer;
}
.pbtn{background:var(--brand);color:#fff;border:0;box-shadow:0 2px 4px rgba(0,0,0,.22)}
.obtn{background:var(--card);color:var(--link);border:2px solid var(--brand);margin-top:20px}
.pbtn[disabled]{opacity:.6}
.msg{font-size:16px;color:var(--muted);margin:0 0 18px}
.msg.err{color:var(--over)}
.profile-wait{padding:28px 16px;color:var(--muted);text-align:center}

/* Page principale */
.home{min-height:100vh;min-height:100dvh;padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))}
.home>.hdr{position:sticky;top:0;z-index:2}
.home-grid{background:var(--bg);min-height:calc(100vh - 57px);padding:24px 16px 28px}
.home-accounts-panel{width:fit-content;max-width:100%;margin:0 auto;padding:16px 12px 18px;border-radius:18px;background:var(--panel)}
.home-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:22px;font-weight:700;margin:0 0 20px}
.home-total{flex:0 0 auto;color:var(--link);font-size:18px;font-weight:700}
.home-cards{display:grid;width:max-content;max-width:100%;grid-template-columns:repeat(2,minmax(0,min(36vw,190px)));gap:14px;justify-items:center}
.home-cards>.home-tile,.home-cards>.home-add-tile{width:96%}
.home-tile{position:relative;overflow:hidden;aspect-ratio:1.23;border:1px solid var(--line);border-radius:16px;padding:16px 12px 14px 17px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.2);font:inherit}
.home-tile.account-card-green{background:radial-gradient(ellipse at 100% 100%,rgba(117,255,190,.34),transparent 48%),linear-gradient(135deg,#00A86B,#006B45);border-color:#007A4C;color:#fff}
.home-tile.account-card-blue{background:radial-gradient(ellipse at 100% 100%,rgba(121,201,255,.34),transparent 48%),linear-gradient(135deg,#2488E8,#123B78);border-color:#1A5FA8;color:#fff}
.home-tile.account-card-green,.home-tile.account-card-blue{padding:11px 12px 10px 15px}
.home-add-tile{aspect-ratio:1.23;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--link);display:grid;place-items:center;font:inherit;font-size:42px;font-weight:400;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.home-add-tile:hover{box-shadow:0 3px 10px rgba(0,0,0,.24)}
.home-tile::before{content:"";position:absolute;right:-44px;bottom:-72px;width:160px;height:160px;border:1px solid rgba(255,255,255,.2);border-radius:50%;box-shadow:0 0 0 14px rgba(255,255,255,.055),0 0 0 34px rgba(255,255,255,.045)}
.home-card-brand,.home-card-chip,.home-cardtop,.home-cardmiddle,.home-cardbottom{position:relative;z-index:1}
.home-card-brand{display:flex;align-items:center;justify-content:flex-end;width:100%;font-size:10px;font-weight:800;letter-spacing:.14em}
.home-cardholder{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;font-size:11px;font-weight:700}
.home-card-contactless{width:17px;height:17px;margin-left:auto;stroke:rgba(255,255,255,.9);fill:none;stroke-width:1.8;stroke-linecap:round}
.home-card-chip{display:block;width:29px;height:18px;margin:9px 0 4px;border:1px solid rgba(255,255,255,.72);border-radius:5px;background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(211,225,222,.74));position:relative}
.home-card-chip::before{content:"";position:absolute;inset:0 9px;border-left:1px solid rgba(30,60,65,.35);border-right:1px solid rgba(30,60,65,.35)}
.home-card-chip::after{content:"";position:absolute;left:0;right:0;top:7px;height:7px;border-top:1px solid rgba(30,60,65,.35);border-bottom:1px solid rgba(30,60,65,.35)}
.home-cardtop{position:absolute;top:50%;left:12px;right:12px;margin:0;text-align:center;transform:translateY(-50%);font-size:clamp(26px,7vw,36px);font-weight:800;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.14)}
.home-cardmiddle{font-size:14px;margin-top:4px;font-weight:600}
.home-cardbottom{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;margin-top:auto;color:rgba(255,255,255,.84);font-size:10px;line-height:1.3;text-transform:uppercase;letter-spacing:.04em}
.home-card-type{margin-left:auto;text-align:right;white-space:nowrap;font-size:16px;font-weight:800;letter-spacing:.04em}
.account-card-green .home-cardbottom,.account-card-blue .home-cardbottom{color:rgba(255,255,255,.82)}
.home-tile{cursor:pointer}
.home-tile:hover{box-shadow:0 3px 10px rgba(0,0,0,.24)}
.home-tile:focus-visible{outline:3px solid var(--link);outline-offset:3px}
.card-detail{background:var(--bg);min-height:calc(100vh - 57px);padding:28px 16px}
.card-detail .home-tile{width:100%;max-width:440px;margin:0 auto}
.card-detail .home-tile{padding-right:56px}
.card-detail .home-card-contactless{margin-right:42px}
.card-edit-button{position:absolute;top:10px;right:10px;z-index:1;width:40px;height:40px;min-width:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow)}
.settings-page{background:var(--bg);min-height:calc(100vh - 57px);padding:24px 16px 28px}
.settings-card{max-width:560px;margin:0 auto;background:var(--card);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.settings-card h1{font-size:22px;margin:0 0 20px}
.settings-row{padding:14px 0;border-bottom:1px solid var(--line)}
.settings-row:last-of-type{border-bottom:0}
.settings-label{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.settings-value{overflow-wrap:anywhere;font-weight:600}
.settings-card .obtn{width:100%;min-width:0}
.account-overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(20,28,24,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.account-dialog{position:relative;width:min(100%,440px);max-height:calc(100dvh - 40px);overflow:auto;background:var(--card);color:var(--ink);border-radius:18px;padding:24px 20px;box-shadow:0 12px 40px rgba(0,0,0,.26)}
.account-dialog h2{font-size:22px;margin:0 44px 8px 0}
.account-dialog-intro{color:var(--muted);font-size:15px;margin:0 0 18px}
.account-close{position:absolute;top:12px;right:12px}
.account-types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.account-type-option{min-height:58px;background:var(--card);color:var(--link);border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.account-type-option:hover{background:var(--bg)}
.account-dialog .fgroup{margin-bottom:18px}
.account-direction{border:0;padding:0;margin:0 0 20px}
.account-direction legend{font-size:16px;font-weight:700;margin-bottom:10px}
.account-direction label{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:15px}
.account-direction input{accent-color:var(--brand);width:18px;height:18px}
.account-dialog .pbtn,.account-dialog .obtn{width:100%;min-width:0}
.account-dialog .msg{margin:0 0 14px}
.delete-confirm{display:grid;gap:10px}
.delete-confirm .delete-action{background:var(--over);color:#fff;border:0}
.delete-confirm .delete-action:hover{filter:brightness(.92)}
.edit-account-actions{display:grid;gap:10px}
.edit-account-actions .delete-action{margin-top:8px;background:var(--card);color:var(--over);border:1px solid var(--over)}
.tabbar{
  position:fixed;left:50%;right:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  z-index:3;display:flex;align-items:center;gap:6px;width:max-content;max-width:calc(100% - 32px);
  padding:7px;background:var(--bar);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:999px;
  box-shadow:0 6px 22px rgba(0,0,0,.24);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)
}
.tabbar button{
  flex:0 0 auto;min-width:112px;background:transparent;border:0;border-radius:999px;color:rgba(255,255,255,.78);font:inherit;font-size:13px;font-weight:600;
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;padding:10px 16px;cursor:pointer;
}
.tabbar button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{background:#fff;color:var(--link);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.16)}
.tabbar button:disabled{opacity:.78;cursor:default}
.tabbar button:focus-visible{outline-color:#fff}

.cfg{padding:16px}
</style>
</head>
<body>
<div id="app"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
var cfg=window.APP_CONFIG||{};
var APP_NAME=cfg.APP_NAME||'Budget App';
document.title=APP_NAME;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function frErr(m){
  m=String(m||'');
  if(/invalid login credentials/i.test(m)) return 'Courriel ou mot de passe incorrect.';
  if(/email not confirmed/i.test(m)) return 'Confirme d\u2019abord ton courriel avec le lien reçu.';
  if(/already registered|already been registered/i.test(m)) return 'Ce courriel a déjà un compte. Connecte-toi.';
  if(/password should be at least/i.test(m)) return 'Le mot de passe doit avoir au moins 6 caractères.';
  if(/signups not allowed|signup is disabled/i.test(m)) return 'La création de comptes est désactivée.';
  if(/rate limit/i.test(m)) return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(/failed to fetch|network/i.test(m)) return 'Pas de connexion. Vérifie ton réseau.';
  return m||'Une erreur est survenue.';
}

var sb=null, session=null, mode='login', view='welcome', activePage='home', activeAccountId=null, profile=null, accounts=[], addAccountOpen=false, addingAccountType='', editingAccountId=null, deleteConfirmId=null, profileStatus='loading', profileError='', profileRequestId=0, authMsg='', authErr=false, busy=false;
function configured(){
  return !!(cfg.SUPABASE_URL&&cfg.SUPABASE_KEY&&!/TON-PROJET/.test(cfg.SUPABASE_URL)&&window.supabase);
}

/* ---------- Icônes ---------- */
var I_PERSON='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-3.9 3.4-6 7.5-6s7.5 2.1 7.5 6"/></svg>';
var I_X='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>';
var I_EDIT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>';
var I_EYE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var I_HOME='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2L12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>';
var I_ACCOUNTS='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="16" height="12" rx="2"/><path d="M3 9h16"/><path d="M7 14h3"/><path d="M7 19h14a1 1 0 0 0 1-1V8"/></svg>';
var I_OUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H10"/><path d="M9 12h11M16 8l4 4-4 4"/></svg>';
var I_SETTINGS='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.5.9l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8z" transform="translate(-1 -1) scale(1.08)"/></svg>';
var ILLU='<svg viewBox="0 0 320 240" aria-hidden="true">'+
  '<circle cx="222" cy="128" r="92" fill="#00874E"/>'+
  '<rect x="26" y="52" width="150" height="100" rx="16" fill="#BFE3CF" transform="rotate(-9 101 102)"/>'+
  '<g transform="rotate(5 180 156)">'+
    '<rect x="78" y="98" width="196" height="116" rx="16" fill="#FFFFFF" stroke="#D6D6D6"/>'+
    '<rect x="78" y="106" width="6" height="100" rx="3" fill="#00874E"/>'+
    '<rect x="104" y="124" width="74" height="15" rx="7.5" fill="#00874E"/>'+
    '<rect x="104" y="152" width="118" height="9" rx="4.5" fill="#D6D6D6"/>'+
    '<rect x="104" y="172" width="84" height="9" rx="4.5" fill="#D6D6D6"/>'+
  '</g></svg>';

function logo(){return '<img src="icon-192.png" alt="">'}
function hdr(inner){return '<header class="hdr">'+inner+'</header>'}

/* ---------- Pages ---------- */
function viewConfig(){
  return hdr('<div class="brand">'+logo()+'<span>'+esc(APP_NAME)+'</span></div>')+
    '<div class="cfg"><div class="fcard"><h2 class="flabel">Configuration manquante</h2>'+
    '<p class="msg">Ouvre le fichier <b>config.js</b> et remplace l\u2019adresse du projet Supabase et la clé publique, puis recharge la page.</p></div></div>';
}

function viewWelcome(){
  return '<main class="welcome">'+
    hdr('<div class="brand">'+logo()+'<span>'+esc(APP_NAME)+'</span></div>')+
    '<div class="wgray">'+ILLU+'</div>'+
    '<section class="sheet"><h1>Bienvenue</h1>'+
      '<button class="gbtn" data-act="goform">'+I_PERSON+'<span>Se connecter</span></button>'+
      '<button class="pill" data-act="gosignup">Créer un compte</button>'+
    '</section></main>';
}

function viewAuth(){
  var titles={login:'Connexion',signup:'Créer un compte',forgot:'Mot de passe oublié',recovery:'Nouveau mot de passe'};
  var btn={login:'Se connecter',signup:'Créer mon compte',forgot:'Envoyer le lien',recovery:'Enregistrer'}[mode];
  var head=hdr((mode==='recovery'?'':'<button class="iconbtn" data-act="back" aria-label="Fermer">'+I_X+'</button>')+'<h2 class="htitle">'+titles[mode]+'</h2>');
  var f='';
  if(mode!=='recovery') f+='<div class="fgroup"><label class="flabel" for="a-mail">Courriel</label><input class="fin" id="a-mail" name="email" type="email" autocomplete="email" inputmode="email" required></div>';
  if(mode!=='forgot'){
    f+='<div class="fgroup"><label class="flabel" for="a-pw">'+(mode==='recovery'?'Nouveau mot de passe':'Mot de passe')+'</label>'+
      '<div class="pw"><input class="fin" id="a-pw" name="password" type="password" minlength="6" autocomplete="'+(mode==='login'?'current-password':'new-password')+'" required>'+
      '<button type="button" class="eye" data-act="toggle-pw" aria-label="Afficher ou masquer le mot de passe">'+I_EYE+'</button></div>'+
      (mode==='login'?'<button type="button" class="flink" data-act="mode" data-mode="forgot" style="margin-top:12px">Mot de passe oublié?</button>':'')+
    '</div>';
  }
  var second='';
  if(mode==='login') second='<button type="button" class="obtn" data-act="mode" data-mode="signup">Créer un compte</button>';
  else if(mode==='signup') second='<button type="button" class="obtn" data-act="mode" data-mode="login">J\u2019ai déjà un compte</button>';
  else if(mode==='forgot') second='<button type="button" class="obtn" data-act="mode" data-mode="login">Retour à la connexion</button>';
  return head+'<main class="formpage"><section class="fcard">'+
    (authMsg?'<p class="msg'+(authErr?' err':'')+'" role="alert">'+esc(authMsg)+'</p>':'')+

function loadProfile(userId,requestId){
  return Promise.all([
    sb.from('app_profiles').select('id,first_name,last_name,debit_balance,credit_balance').eq('id',userId).maybeSingle(),
    sb.from('app_accounts').select('id,user_id,account_type,name,signed_balance,balance_direction,created_at').eq('user_id',userId).order('created_at',{ascending:true})
  ]).then(function(results){
      if(requestId!==profileRequestId||!session||session.user.id!==userId) return;
      var profileResult=results[0], accountsResult=results[1];
      if(profileResult.error||accountsResult.error){
        profileStatus='error';
        profileError='Impossible de charger ton profil ou tes comptes : '+(profileResult.error?profileResult.error.message:accountsResult.error.message);
      }else if(profileResult.data){
        profile=profileResult.data;
        accounts=accountsResult.data||[];
        profileStatus='ready';
        profileError='';
      }else{
        profile=null;
        accounts=[];
        profileStatus='missing';
        profileError='';
      }
      render();
    }).catch(function(error){
      if(requestId!==profileRequestId) return;
      profileStatus='error';
      profileError='Impossible de charger ton profil : '+(error&&error.message?error.message:'erreur réseau');
      render();
    });
}

    else html=viewAuth();
  }
  else if(profileStatus==='loading'||profileStatus==='error') html=viewProfileStatus();
  else if(profileStatus==='missing') html=viewOnboarding();
  else {html=activePage==='settings'?viewSettings():activeAccountId?viewCard():viewHome();white=true}
  $('app').innerHTML=html;
  document.documentElement.classList.toggle('lock',lock);
  document.body.classList.toggle('white',white);
  document.body.classList.toggle('modal-open',addAccountOpen||deleteConfirmId!==null);
}

/* ---------- Actions ---------- */
function guard(fn){
  if(busy) return Promise.resolve();
  busy=true;
  return fn().catch(function(e){authMsg=frErr(e&&e.message);authErr=true}).then(function(){busy=false;render()});
}

function resetSignedOutState(){
  session=null;mode='login';view='welcome';activePage='home';activeAccountId=null;
  profile=null;accounts=[];addAccountOpen=false;addingAccountType='';editingAccountId=null;deleteConfirmId=null;
  profileStatus='loading';profileError='';profileRequestId++;
  authMsg='';authErr=false;
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b) return;
  var act=b.dataset.act;
  if(act==='close-account-modal'){
    if(b.classList.contains('account-overlay')&&e.target!==b) return;
    addAccountOpen=false;addingAccountType='';editingAccountId=null;deleteConfirmId=null;authMsg='';authErr=false;render();return;
  }
  if(act==='cancel-delete-account'){
    deleteConfirmId=null;render();return;
  }
  if(act==='open-account-modal'){addAccountOpen=true;addingAccountType='';editingAccountId=null;deleteConfirmId=null;authMsg='';authErr=false;render();return}
  if(act==='select-account-type'){
    var accountType=b.dataset.type;
    if(['debit','credit','investment','other'].indexOf(accountType)===-1) return;
    addingAccountType=accountType;authMsg='';authErr=false;render();return;
  }
  if(act==='back-account-types'){addingAccountType='';authMsg='';authErr=false;render();return}
  if(act==='goform'){view='form';mode='login';authMsg='';authErr=false;render();window.scrollTo(0,0);return}
  if(act==='gosignup'){view='form';mode='signup';authMsg='';authErr=false;render();window.scrollTo(0,0);return}
  if(act==='back'){view='welcome';mode='login';authMsg='';authErr=false;render();return}
  if(act==='open-account'){activeAccountId=b.dataset.accountId;activePage='home';authMsg='';authErr=false;render();window.scrollTo(0,0);return}
  if(act==='edit-account'){
    var editId=b.dataset.accountId;
    if(!accounts.some(function(account){return account.id===editId})) return;
    activeAccountId=editId;editingAccountId=editId;addAccountOpen=true;deleteConfirmId=null;authMsg='';authErr=false;render();return;
  }
  if(act==='home'){activePage='home';activeAccountId=null;addAccountOpen=false;editingAccountId=null;deleteConfirmId=null;render();window.scrollTo(0,0);return}
  if(act==='settings'){activePage='settings';activeAccountId=null;addAccountOpen=false;editingAccountId=null;deleteConfirmId=null;render();window.scrollTo(0,0);return}
  if(act==='delete-account'){
    var deleteId=b.dataset.accountId;
    var deleteAccount=accounts.find(function(account){return account.id===deleteId});
    if(!deleteAccount) return;
    deleteConfirmId=deleteId;render();return;
  }
  if(act==='confirm-delete-account'){
    var deleteId=b.dataset.accountId;
    var deleteAccount=accounts.find(function(account){return account.id===deleteId});
    if(!deleteAccount||deleteConfirmId!==deleteId) return;
    deleteConfirmId=null;
    guard(async function(){
      var result=await sb.from('app_accounts').delete().eq('id',deleteId).eq('user_id',session.user.id).select('id').maybeSingle();
      if(result.error) throw new Error(result.error.message);
      if(!result.data) throw new Error('Le compte n’a pas été trouvé dans Supabase; il n’a pas été supprimé.');
      accounts=accounts.filter(function(account){return account.id!==deleteId});
      activeAccountId=null;
      activePage='home';
      addAccountOpen=false;
      editingAccountId=null;
      deleteConfirmId=null;
      authMsg='';authErr=false;
    });
    return;
  }
  if(act==='retry-profile'&&session){profileStatus='loading';profileError='';var requestId=++profileRequestId;render();loadProfile(session.user.id,requestId);return}
  if(act==='mode'){mode=b.dataset.mode;authMsg='';authErr=false;render();return}
  if(act==='toggle-pw'){
    var pw=$('a-pw');
    if(pw) pw.type=(pw.type==='password')?'text':'password';
    return;
  }
  if(act==='signout'){
    guard(async function(){
      var current=await sb.auth.getSession();
      if(current.error) throw new Error(current.error.message);
      if(!current.data.session){
        resetSignedOutState();
        return;
      }
      var result=await sb.auth.signOut({scope:'local'});
      if(result.error){
        if(result.error.code==='AuthSessionMissingError'||/auth session missing/i.test(result.error.message||'')){
          resetSignedOutState();
          return;
        }
        throw new Error(result.error.message);
      }
      resetSignedOutState();
    });
  }
});

document.addEventListener('submit',function(e){
  var editForm=e.target.closest('form[data-form="edit-account"]');
  if(editForm){
    e.preventDefault();
    var editId=editForm.dataset.accountId;
    var editData=new FormData(editForm);
    guard(async function(){
      authMsg='';authErr=false;
      var account=accounts.find(function(item){return item.id===editId});
      var name=String(editData.get('name')||'').trim();
      var amountRaw=String(editData.get('amount')||'').trim();
      var validAmountFormat=/^-?\d+(?:[.,]\d{1,2})?$/.test(amountRaw);
      var amount=validAmountFormat?Number(amountRaw.replace(',','.')):NaN;
      var direction=String(editData.get('direction')||'');
      var requiresDirection=account&&(account.account_type==='investment'||account.account_type==='other');
      var invalidDirection=requiresDirection&&!['positive','negative'].includes(direction);
      var invalidAmount=requiresDirection?amount<0:!Number.isFinite(amount);
      if(!account||!name||name.length>80||!validAmountFormat||!Number.isFinite(amount)||Math.abs(amount)>9999999999.99||invalidAmount||invalidDirection){
        authMsg='Vérifie le nom, le montant (maximum deux décimales) et le type de solde choisi.';
        authErr=true;
        return;
      }
      var signedBalance=account.account_type==='credit'?-amount:
        account.account_type==='debit'?amount:
        direction==='negative'?-Math.abs(amount):Math.abs(amount);
      var result=await sb.from('app_accounts').update({
        name:name,
        signed_balance:signedBalance,
        balance_direction:signedBalance<0?'negative':'positive'
      }).eq('id',editId).eq('user_id',session.user.id)
        .select('id,user_id,account_type,name,signed_balance,balance_direction,created_at').maybeSingle();
      if(result.error) throw new Error(result.error.message);
      if(!result.data){
        var existing=await sb.from('app_accounts').select('id').eq('id',editId).eq('user_id',session.user.id).maybeSingle();
        if(existing.error) throw new Error(existing.error.message);
        if(existing.data) throw new Error('Supabase a refusé la modification. Exécute de nouveau le fichier supabase-schema.sql dans le SQL Editor pour activer les droits de modification des comptes, puis réessaie.');
        throw new Error('Ce compte est introuvable dans Supabase; les modifications n’ont pas été enregistrées. Recharge la liste des comptes et réessaie.');
      }
      accounts=accounts.map(function(account){return account.id===editId?result.data:account});
      addAccountOpen=false;
      editingAccountId=null;
      deleteConfirmId=null;
      authMsg='';authErr=false;
    });
    return;
  }
  var af=e.target.closest('form[data-form="account"]');
  if(af){
    e.preventDefault();
    var afd=new FormData(af);
    guard(async function(){
      authMsg='';authErr=false;
      var name=String(afd.get('name')||'').trim();
      var amountRaw=String(afd.get('amount')||'').trim();
      var validAmountFormat=/^-?\d+(?:[.,]\d{1,2})?$/.test(amountRaw);
      var amount=validAmountFormat?Number(amountRaw.replace(',','.')):NaN;
      var direction=String(afd.get('direction')||'');
      var requiresDirection=addingAccountType==='investment'||addingAccountType==='other';
      var amountTooLarge=Math.abs(amount)>9999999999.99;
      var invalidDirection=requiresDirection&&!['positive','negative'].includes(direction);
      var invalidAmount=requiresDirection?amount<0||amountTooLarge:amountTooLarge;
      if(!name||name.length>80||!validAmountFormat||!Number.isFinite(amount)||invalidAmount||invalidDirection){
        authMsg='Vérifie le nom, le montant (maximum deux décimales) et le type de solde choisi.';
        authErr=true;
        return;
      }
      var signedBalance=addingAccountType==='credit'?-amount:
        addingAccountType==='debit'?amount:
        direction==='negative'?-Math.abs(amount):Math.abs(amount);
      var result=await sb.from('app_accounts').insert({
        user_id:session.user.id,
        account_type:addingAccountType,
        name:name,
        signed_balance:signedBalance,
        balance_direction:signedBalance<0?'negative':'positive'
      }).select('id,user_id,account_type,name,signed_balance,balance_direction,created_at').single();
      if(result.error) throw new Error(result.error.message);
      accounts.push(result.data);
      addAccountOpen=false;
      addingAccountType='';
      authMsg='';authErr=false;
    });
    return;
  }
  var pf=e.target.closest('form[data-form="profile"]');
  if(pf){
    e.preventDefault();
    var pfd=new FormData(pf);
    guard(async function(){
      authMsg='';authErr=false;
      var first=String(pfd.get('first_name')||'').trim();
      var last=String(pfd.get('last_name')||'').trim();
      var debitRaw=String(pfd.get('debit_balance')||'');
      var debit=Number(debitRaw);
      if(!first||!last||!debitRaw||!Number.isFinite(debit)){
        authMsg='Entre un prénom, un nom et des montants valides.';
        authErr=true;
        return;
      }
      var result=await sb.rpc('create_initial_profile',{
        p_first_name:first,
        p_last_name:last,
        p_debit_balance:debit
      });
      if(result.error) throw new Error(result.error.message);
      beginProfileLoad(session.user.id);
    });
    return;
  }
  var f=e.target.closest('form[data-form="auth"]');
  if(!f) return;
  e.preventDefault();
  var fd=new FormData(f);
  guard(async function(){
    authMsg='';authErr=false;
    var email=String(fd.get('email')||'').trim(), pw=String(fd.get('password')||'');
    var here=location.origin+location.pathname;
    if(mode==='login'){
      var r=await sb.auth.signInWithPassword({email:email,password:pw});
      if(r.error){authMsg=frErr(r.error.message);authErr=true}
    }else if(mode==='signup'){
      var r2=await sb.auth.signUp({email:email,password:pw,options:{emailRedirectTo:here}});
      if(r2.error){authMsg=frErr(r2.error.message);authErr=true}
      else if(!r2.data.session){authMsg='Compte créé. Ouvre le lien reçu par courriel pour le confirmer, puis connecte-toi.';mode='login'}
    }else if(mode==='forgot'){
      var r3=await sb.auth.resetPasswordForEmail(email,{redirectTo:here});
      if(r3.error){authMsg=frErr(r3.error.message);authErr=true}
      else{authMsg='Si ce courriel a un compte, un lien vient de lui être envoyé.';mode='login'}
    }else if(mode==='recovery'){
      var r4=await sb.auth.updateUser({password:pw});
      if(r4.error){authMsg=frErr(r4.error.message);authErr=true}
      else{authMsg='';mode='login';if(session) beginProfileLoad(session.user.id)}
    }
  });
});

/* ---------- Démarrage ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
if(configured()){
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(ev,s){
    session=s;
    if(ev==='PASSWORD_RECOVERY'){mode='recovery';view='form';authMsg='';authErr=false}
    else if(ev==='SIGNED_OUT') resetSignedOutState();
    if(ev==='TOKEN_REFRESHED') return;
    if(s&&s.user&&mode!=='recovery'){
      beginProfileLoad(s.user.id);
      return;
    }
    render();
  });
}
render();
})();
</script>
</body>
</html>
